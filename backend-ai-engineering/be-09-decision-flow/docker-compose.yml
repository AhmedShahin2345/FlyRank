version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: be-09-decision-flow/Dockerfile
    ports:
      - "3009:3009"
    environment:
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - NEXT_PUBLIC_APP_URL=http://localhost:3009
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  inngest-dev:
    image: inngest/inngest-cli:latest
    command: dev -u http://app:3009/api/inngest
    ports:
      - "8288:8288"
    depends_on:
      - app
    environment:
      - INNGEST_DEV=true

volumes:
  redis_data: